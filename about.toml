# cargo-about 的配置，用于生成随安装包分发的第三方许可清单（scripts/build-notices.mjs）。
# 允许的许可与 scripts/check-licenses.mjs 的规则一致：不含 GPL / AGPL / LGPL；这里列出依赖中实际出现的宽松许可，
# 出现不在列表中的许可时生成失败，需先确认协议再加入。
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "CC0-1.0",
    "MPL-2.0",
]
# 清单随 Windows 安装包分发
targets = ["x86_64-pc-windows-msvc"]
# 开发依赖不随程序分发
ignore-dev-dependencies = true
