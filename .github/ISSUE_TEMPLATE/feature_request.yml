name: 功能建议
description: 提出新功能、改进或体验优化建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        > **警告：** 删除以下内容会导致 Issue 被直接关闭。

        感谢你的建议。请尽量描述使用场景、预期效果和可能的替代方案，以便评估是否适合纳入本项目。

        > **注意：** Rummage 只读取你选定的文件夹，不修改、不移动、不删除任何文件，也不把文件上传到网络。需要改动文件或依赖在线服务的建议通常不会采纳。

        > **关于响应时间：** 项目维护者精力有限，不能保证始终按预期效率修复问题或完成优化，敬请理解。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认没有重复建议。
          required: true
        - label: 我理解项目维护者精力有限，不能保证始终按预期效率完成优化。
          required: true

  - type: dropdown
    id: platform
    attributes:
      label: 适用平台
      multiple: true
      options:
        - Windows
        - Android
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 使用场景 / 想解决的问题
      description: 这个功能想解决什么问题？请描述具体的使用场景。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望项目如何实现或呈现这个功能？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你是否尝试过其他方案？为什么现有方案不够好？
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 可以补充截图、参考链接、相关项目或其他说明。
    validations:
      required: false
