name: Build Desktop Client

# 只由推送 v* tag 触发；不提供为已有 tag 手动重新构建的入口，已发布版本有问题时发布新版本修复
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: tauri-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # job 级 if 不能引用 secrets，先由轻量 job 判断是否配置了签名私钥；未配置时跳过构建
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$SIGNING_KEY" ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not set. Skipping desktop client build."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

  windows:
    needs: check
    if: ${{ needs.check.outputs.enabled == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version and extract release notes
        id: meta
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(jq -r .version package.json)
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::tag $TAG 与 package.json 的版本 $version 不一致"
            exit 1
          fi
          # 所有 crate 继承根 Cargo.toml 的 [workspace.package] version
          cargo_version=$(awk '/^\[/ { section = $0; next } section == "[workspace.package]" && /^version *=/ { gsub(/.*= *"|".*/, ""); print; exit }' Cargo.toml)
          if [[ "$cargo_version" != "$version" ]]; then
            echo "::error::Cargo.toml 的工作区版本 $cargo_version 与 package.json 的版本 $version 不一致"
            exit 1
          fi
          # Release 正文取 RELEASE.md 中对应版本的段落（含标题），与客户端的更新弹窗显示一致
          awk -v head="## v$version（" 'index($0, head) == 1 { found = 1; print; next } found && /^## v/ { exit } found { print }' RELEASE.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "::error::RELEASE.md 中没有 v$version 的发布记录"
            exit 1
          fi
          {
            echo 'body<<RELEASE_NOTES_EOF'
            cat release-notes.md
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      # 生成第三方许可清单用（scripts/build-notices.mjs），版本与 scripts/build-notices.mjs 中的安装命令一致
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      # llama.cpp 运行库（CPU、Vulkan）与 ffmpeg：获取脚本校验钉定的 SHA-256，缓存命中且哈希正确时不再下载
      - uses: actions/cache@v4
        with:
          path: .cache/third-party
          key: third-party-${{ hashFiles('scripts/fetch-llama.ps1', 'scripts/fetch-ffmpeg.ps1', 'scripts/common.ps1') }}

      - name: Fetch third-party binaries
        # 获取脚本按 Windows PowerShell 5.1 编写，与本机用法相同
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/fetch-llama.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          powershell -ExecutionPolicy Bypass -File scripts/fetch-llama.ps1 -Variant vulkan
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          powershell -ExecutionPolicy Bypass -File scripts/fetch-ffmpeg.ps1

      - run: npm ci

      # 构建 NSIS 安装包并用私钥（及其密码，均来自 GitHub Secrets）为更新包签名；安装包、.sig 和 latest.json 上传到 tag 对应的 Release。
      # package.json 没有 tauri 脚本，需指定 tauriScript；--config 与 npm run tauri:build 相同，合并打包用的 externalBin 与 resources
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: ${{ steps.meta.outputs.tag }}
          releaseBody: ${{ steps.meta.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          tauriScript: npx tauri
          args: --config src-tauri/tauri.bundle.conf.json

      # tauri-action 在 Release 已存在时只上传文件，不改标题、正文和草稿状态。
      # 这里统一改为 RELEASE.md 的正文并设为正式版，客户端的更新地址 releases/latest/download/latest.json 才能指向它
      - name: Sync release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md --draft=false --prerelease=false
