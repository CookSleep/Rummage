[package]
name = "rummage"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rummage"

[lib]
name = "rummage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = ["devtools", "tray-icon"] }
tauri-plugin-dialog = "=2.8.2"
tauri-plugin-log = "=2.10.1"
tauri-plugin-opener = "=2.7.1"
# 诊断包的 Deflate 压缩与 CRC（src/zip.rs），已是 png、tiff 的依赖
flate2 = "=1.1.10"
log = "=0.4.34"
# 检查更新时读取 GitHub Releases（src/releases.rs），版本与特性同核心进程的模型下载
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "system-proxy"] }
rummage-core = { path = "../crates/rummage-core" }
rummage-datadir = { path = "../crates/rummage-datadir" }
# 诊断包中的显卡与驱动版本（adapters）、推理运行库版本
rummage-embed = { path = "../crates/rummage-embed" }
# 预览原图前的网盘占位文件检查（ensure_local）
rummage-index = { path = "../crates/rummage-index" }
rummage-proto = { path = "../crates/rummage-proto" }
# 应用内更新的版本比较，与 tauri 的 PackageInfo.version 同一版本
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# 设置“Agent”页改写 AI 工具的 MCP 配置时保留原有注释与排版（src/agent.rs）；jsonc-parser 为 MIT，toml_edit 为 MIT OR Apache-2.0，后者已是 tauri 的间接依赖
jsonc-parser = { version = "=0.34.0", features = ["cst", "serde_json"] }
toml_edit = "=0.25.17"
# 已下载更新包的校验值
sha2 = "=0.10.9"
# fs：Android 上边下载边写入更新包（src/android/update.rs）
tokio = { version = "=1.53.2", features = ["fs", "io-util", "sync", "time"] }

[dev-dependencies]
tempfile = "=3.27.0"

# 只有桌面平台能用的插件
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# 去掉资源目录的 \\?\ 前缀（src/agent.rs），已是 tauri 的依赖，CC0-1.0 OR MIT-0 OR Apache-2.0
dunce = "=1.0.5"
tauri-plugin-single-instance = "=2.5.3"
# 应用内更新（src/update.rs），只供 Rust 侧的更新命令使用
tauri-plugin-updater = "=2.13.3"
tauri-plugin-window-state = "=2.5.0"

# Android 的启动准备与进程内后台服务（src/android.rs）
[target.'cfg(target_os = "android")'.dependencies]
# 调用 Java 取应用的目录、安装时间与 AssetManager；与 rustls-platform-verifier 0.7.1 用同一版本，MIT OR Apache-2.0
jni = "=0.22.4"
# 从 APK 的 assets 拷出黄金样本（AssetManager），MIT OR Apache-2.0
ndk = { version = "=0.9.0", default-features = false }
# 启动时忽略 SIGPIPE（src/android.rs），版本同锁文件中已有的，MIT OR Apache-2.0
libc = "=0.2.190"
# tao 初始化的 JavaVM 与应用 Context，MIT OR Apache-2.0
ndk-context = "=0.1.1"
# 启动时初始化系统证书校验，版本同 reqwest 带进来的，MIT OR Apache-2.0
rustls-platform-verifier = "=0.7.1"
# 存储权限、选择文件夹与文件（src/android/storage.rs）
tauri-plugin-rummage-android = { path = "../crates/tauri-plugin-rummage-android" }

[target.'cfg(windows)'.dependencies]
# 读取系统主题，创建主窗口时设置背景色；诊断包中的系统版本
windows-registry = "=0.6.1"
# 用 “edit” 动词打开脚本（ShellExecuteExW，见 src/windows.rs；其结构体 SHELLEXECUTEINFOW 需要 Win32_System_Registry）；诊断包的本地时间（GetLocalTime）；
# 托盘强制结束核心进程（TerminateProcess）与换算暂停到期的本地时间（Win32_System_Time）
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
