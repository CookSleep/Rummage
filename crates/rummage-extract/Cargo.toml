[package]
name = "rummage-extract"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# 内嵌媒体的去重键，与 rummage-index 同版本
blake3 = { version = "=1.8.7", default-features = false, features = ["std"] }
# 判断加密的 Word 97–2003 文件（读 CFB 容器中的文件头），MIT；与 xberg 用的同版本
cfb = "=0.15.0"
# 没有 BOM 且不是合法 UTF-8 的文本猜测编码（兼顾 GBK 等），Apache-2.0 OR MIT
chardetng = "=1.0.0"
# 按 BOM 或猜测结果解码，(Apache-2.0 OR MIT) AND BSD-3-Clause
encoding_rs = "=0.8.42"
# 读 zip 中内嵌图片的尺寸（解码前过滤），格式与 rummage-media 相同
image = { version = "=0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
log = "=0.4.34"
# OOXML / ODF 的关系文件与正文 XML，MIT OR Apache-2.0；与 xberg 用的同版本
roxmltree = "=0.21.1"
rummage-index = { path = "../rummage-index" }
rummage-proto = { path = "../rummage-proto" }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
# Xberg 是异步接口，在提取线程上用单线程运行时执行；与 rummage-core 同版本，MIT
tokio = { version = "=1.53.2", features = ["rt", "time"] }
# 文档提取，MIT。只开需要的格式，不开 OCR、版面分析、嵌入等会拉进 ONNX Runtime 的部分
xberg = { version = "=1.3.9", default-features = false, features = ["pdf", "office", "excel", "html", "xml", "tokio-runtime"] }
# PDF 的内嵌图片：Xberg 自己的 PDF 后端，MIT；必须与 xberg 同版本、一起升级
xberg-native-pdf = "=1.3.9"
# OOXML / ODF 的 zip 包，MIT；与 xberg 用的同版本
zip = { version = "=9.0.2", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
# 切片结果的快照测试，Apache-2.0
insta = "=1.49.0"
rummage-embed = { path = "../rummage-embed" }
tempfile = "=3.27.0"
